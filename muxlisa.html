<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Saytim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #333;
        }

        header {
            background: #0077cc;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #005fa3;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        .hero {
            padding: 80px 20px;
            text-align: center;
            background: white;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #0077cc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #005fa3;
        }

        footer {
            margin-top: 40px;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Mening Birinchi Saytim</h1>
    <p>HTML va CSS yordamida yaratilgan</p>
</header>

<nav>
    <a href="#">Bosh sahifa</a>
    <a href="#">Biz haqimizda</a>
    <a href="#">Xizmatlar</a>
    <a href="#">Bog'lanish</a>
</nav>

<section class="hero">
    <h1>Xush kelibsiz!</h1>
    <p>Bu oddiy va zamonaviy HTML sayt namunasi.</p>
    <a href="#" class="btn">Boshlash</a>
</section>

<footer>
    <p>&copy; 2026 Mening Saytim. Barcha huquqlar himoyalangan.</p>
</footer>

</body>
</html>
